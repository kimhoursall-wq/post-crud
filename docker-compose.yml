services:
  app:
    build: .
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && apache2-foreground"

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: post_db
      MYSQL_USER: post_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      retries: 20

volumes:
  dbdata:
